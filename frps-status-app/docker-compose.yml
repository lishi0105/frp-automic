services:
  frps-status:
    build:
      context: .
      tags:
        - lishi0105/frps-status:latest
    image: lishi0105/frps-status:v0.1
    container_name: frps_status
    restart: unless-stopped
    ports:
      - "${STATUS_APP_BIND:-127.0.0.1}:${STATUS_APP_PORT:-28080}:8080"
    environment:
      LISTEN: "${LISTEN:-0.0.0.0:8080}"
      DB_PATH: "${DB_PATH:-/data/frps-status.sqlite}"
      FRPS_HOST: "${FRPS_HOST:-frps}"
      FRPS_BIND_PORT: "${FRPS_BIND_PORT:-7000}"
      FRPS_DASHBOARD_PORT: "${FRPS_DASHBOARD_PORT:-7500}"
      FRPS_DASHBOARD_USER: "${FRPS_DASHBOARD_USER:-admin}"
      FRPS_DASHBOARD_PASSWORD: "${FRPS_DASHBOARD_PASSWORD:-}"
      STATUS_DOMAINS: "${STATUS_DOMAINS:-}"
      STATUS_USER: "${STATUS_USER:-}"
      STATUS_PASSWORD: "${STATUS_PASSWORD:-}"
      CERT_DIR: "${CERT_DIR:-/etc/letsencrypt/live}"
      POLL_SECONDS: "${POLL_SECONDS:-60}"
      HOST_PUBLIC_IP: "${HOST_PUBLIC_IP:-}"
      HOST_IFACE: "${HOST_IFACE:-}"
      HOST_NET_STATS_DIR: "${HOST_NET_STATS_DIR:-/host-net-stats}"
    volumes:
      - ./data:/data
      - ${FRPS_CERTBOT_CONF_DIR:-../frps/certbot/conf}:/etc/letsencrypt:ro
      - ${HOST_NET_STATS_MOUNT:-/sys/class/net/eth0/statistics}:/host-net-stats:ro
    networks:
      - frps_net

networks:
  frps_net:
    external: true
    name: frps_default
