<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.2"/>
    </filter>
    <style>
      .cn { font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, Menlo, monospace; }
      .title { font-size: 18px; font-weight: 700; fill: #0F172A; }
      .label { font-size: 13px; fill: #475569; }
      .hint { font-size: 12px; fill: #64748B; }
      .required { fill: #EF4444; font-size: 13px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="#0F172A" fill-opacity="0.32"/>

  <rect x="292" y="90" width="856" height="720" rx="12" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>

  <text x="324" y="136" class="cn title">配置邮件服务</text>
  <rect x="1102" y="112" width="30" height="30" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="1117" y="133" class="cn" text-anchor="middle" font-size="16" fill="#64748B">×</text>
  <line x1="292" y1="170" x2="1148" y2="170" stroke="#E2E8F0"/>

  <text x="366" y="238" class="cn required">*</text>
  <text x="388" y="238" class="cn label">名称</text>
  <rect x="470" y="210" width="628" height="50" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="490" y="241" class="cn" font-size="16" fill="#0F172A">frps告警</text>

  <text x="366" y="308" class="cn required">*</text>
  <text x="388" y="308" class="cn label">发送人邮箱</text>
  <rect x="470" y="280" width="628" height="50" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="490" y="311" class="cn mono" font-size="16" fill="#0F172A">alert@example.com</text>

  <text x="366" y="378" class="cn required">*</text>
  <text x="388" y="378" class="cn label">SMTP授权码</text>
  <rect x="470" y="350" width="526" height="50" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="490" y="381" class="cn mono" font-size="16" fill="#0F172A">••••••••••••••••</text>
  <rect x="1012" y="350" width="86" height="50" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="1055" y="381" class="cn" text-anchor="middle" font-size="16" fill="#64748B">显示</text>

  <text x="366" y="448" class="cn required">*</text>
  <text x="388" y="448" class="cn label">SMTP服务器</text>
  <rect x="470" y="420" width="628" height="50" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="490" y="451" class="cn mono" font-size="16" fill="#0F172A">smtp.qq.com</text>

  <text x="366" y="518" class="cn required">*</text>
  <text x="388" y="518" class="cn label">端口</text>
  <rect x="470" y="490" width="628" height="50" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="490" y="521" class="cn mono" font-size="16" fill="#0F172A">465</text>

  <text x="366" y="588" class="cn required">*</text>
  <text x="388" y="588" class="cn label">接收邮箱</text>
  <rect x="470" y="560" width="628" height="124" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="490" y="592" class="cn mono" font-size="16" fill="#0F172A">lishi0105@163.com</text>

  <text x="388" y="744" class="cn label">启用</text>
  <rect x="470" y="722" width="66" height="36" rx="18" fill="#10B981"/>
  <circle cx="516" cy="740" r="14" fill="#FFFFFF"/>

  <circle cx="390" cy="784" r="3" fill="#64748B"/>
  <text x="410" y="789" class="cn hint">推荐使用465端口，协议为SSL/TLS</text>
  <circle cx="390" cy="818" r="3" fill="#64748B"/>
  <text x="410" y="823" class="cn hint">25端口为SMTP协议，587端口为STARTTLS协议</text>

  <line x1="292" y1="848" x2="1148" y2="848" stroke="#E2E8F0"/>
  <rect x="324" y="870" width="140" height="44" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="394" y="898" class="cn" text-anchor="middle" font-size="13" fill="#334155">发送测试邮件</text>

  <rect x="954" y="870" width="86" height="44" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="997" y="898" class="cn" text-anchor="middle" font-size="13" fill="#334155">取消</text>
  <rect x="1054" y="870" width="92" height="44" rx="10" fill="#0F172A"/>
  <text x="1100" y="898" class="cn" text-anchor="middle" font-size="13" font-weight="650" fill="#F8FAFC">确定</text>
</svg>
