<svg width="1000" height="600" viewBox="0 0 1000 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1000" height="600" fill="#F8FAFC"/>
  
  <text x="40" y="50" font-family="PingFang SC, sans-serif" font-size="24" font-weight="600" fill="#1E293B">系统配置</text>
  <text x="40" y="76" font-family="PingFang SC, sans-serif" font-size="14" fill="#64748B">管理 FRPS 监控平台的全局参数与数据存储</text>

  <rect x="40" y="110" width="450" height="220" rx="12" fill="white" stroke="#E2E8F0"/>
  <text x="64" y="145" font-family="PingFang SC, sans-serif" font-size="16" font-weight="600" fill="#1E293B">流量阈值设置</text>
  <g transform="translate(64, 180)">
    <text y="0" font-family="PingFang SC, sans-serif" font-size="13" fill="#64748B">月上行阈值 (GB)</text>
    <rect y="12" width="180" height="36" rx="6" stroke="#CBD5E1" fill="white"/>
    <text x="12" y="35" font-family="Arial" font-size="14" fill="#1E293B">500</text>
    
    <text x="210" y="0" font-family="PingFang SC, sans-serif" font-size="13" fill="#64748B">月下行阈值 (GB)</text>
    <rect x="210" y="12" width="180" height="36" rx="6" stroke="#CBD5E1" fill="white"/>
    <text x="222" y="35" font-family="Arial" font-size="14" fill="#1E293B">1024</text>
  </g>
  <rect x="400" y="280" width="70" height="32" rx="6" fill="#2563EB"/>
  <text x="435" y="301" font-family="PingFang SC, sans-serif" font-size="12" font-weight="600" fill="white" text-anchor="middle">保存</text>

  <rect x="510" y="110" width="450" height="220" rx="12" fill="white" stroke="#E2E8F0"/>
  <text x="534" y="145" font-family="PingFang SC, sans-serif" font-size="16" font-weight="600" fill="#1E293B">告警通知服务</text>
  <rect x="534" y="170" width="402" height="60" rx="8" fill="#F0FDF4" stroke="#BBF7D0"/>
  <circle cx="554" cy="200" r="4" fill="#16A34A"/>
  <text x="568" y="205" font-family="PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#166534">SMTP 服务已就绪</text>
  <text x="534" y="250" font-family="PingFang SC, sans-serif" font-size="12" fill="#64748B">当前接收人: admin@example.com ...</text>
  <rect x="830" y="280" width="110" height="32" rx="6" stroke="#2563EB" fill="white"/>
  <text x="885" y="301" font-family="PingFang SC, sans-serif" font-size="12" font-weight="600" fill="#2563EB" text-anchor="middle">配置邮件告警</text>

  <rect x="40" y="350" width="920" height="200" rx="12" fill="white" stroke="#E2E8F0"/>
  <text x="64" y="385" font-family="PingFang SC, sans-serif" font-size="16" font-weight="600" fill="#1E293B">数据库维护 (SQLite)</text>
  
  <g transform="translate(64, 420)">
    <rect width="380" height="80" rx="8" fill="#F8FAFC" stroke="#F1F5F9"/>
    <text x="16" y="30" font-family="PingFang SC, sans-serif" font-size="14" font-weight="600" fill="#334155">空间碎片整理 (VACUUM)</text>
    <text x="16" y="52" font-family="PingFang SC, sans-serif" font-size="12" fill="#94A3B8">立即释放数据库占用的冗余磁盘空间</text>
    <rect x="280" y="25" width="80" height="30" rx="6" fill="#334155"/>
    <text x="320" y="44" font-family="PingFang SC, sans-serif" font-size="11" fill="white" text-anchor="middle">执行压缩</text>

    <rect x="410" width="420" height="80" rx="8" fill="#FFFBEB" stroke="#FEF3C7"/>
    <text x="426" y="30" font-family="PingFang SC, sans-serif" font-size="14" font-weight="600" fill="#92400E">历史数据清理</text>
    <text x="426" y="55" font-family="PingFang SC, sans-serif" font-size="13" fill="#B45309">保留近</text>
    <rect x="475" y="38" width="45" height="24" rx="4" fill="white" stroke="#D97706"/>
    <text x="497" y="55" font-family="Arial" font-size="13" fill="#1E293B" text-anchor="middle">30</text>
    <text x="525" y="55" font-family="PingFang SC, sans-serif" font-size="13" fill="#B45309">天记录</text>
    
    <rect x="730" y="25" width="80" height="30" rx="6" fill="#D97706"/>
    <text x="770" y="44" font-family="PingFang SC, sans-serif" font-size="11" fill="white" text-anchor="middle">立即清理</text>
  </g>
</svg>
