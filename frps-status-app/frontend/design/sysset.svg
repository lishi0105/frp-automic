<svg width="1000" height="500" viewBox="0 0 1000 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1000" height="500" fill="#F8FAFC"/>
  
  <text x="30" y="40" font-family="PingFang SC, sans-serif" font-size="20" font-weight="600" fill="#1E293B">系统配置</text>

  <rect x="30" y="70" width="940" height="120" rx="10" fill="white" stroke="#E2E8F0"/>
  <text x="50" y="100" font-family="PingFang SC, sans-serif" font-size="14" font-weight="600" fill="#1E293B">流量阈值设置</text>
  
  <g transform="translate(50, 120)">
    <text y="5" font-family="PingFang SC" font-size="12" fill="#64748B">月上行 (GB)</text>
    <rect x="80" y="-12" width="100" height="28" rx="4" stroke="#D1D5DB" fill="white"/>
    <text x="90" y="7" font-family="Arial" font-size="13" fill="#1E293B">300</text>
    
    <text x="210" y="5" font-family="PingFang SC" font-size="12" fill="#64748B">月下行 (GB)</text>
    <rect x="290" y="-12" width="100" height="28" rx="4" stroke="#D1D5DB" fill="white"/>
    <text x="300" y="7" font-family="Arial" font-size="13" fill="#1E293B">300</text>
    
    <text x="420" y="5" font-family="PingFang SC" font-size="12" fill="#64748B">上下行总量 (GB)</text>
    <rect x="530" y="-12" width="100" height="28" rx="4" stroke="#D1D5DB" fill="white"/>
    <text x="540" y="7" font-family="Arial" font-size="13" fill="#1E293B">400</text>
    
    <rect x="830" y="-12" width="60" height="28" rx="4" fill="#2563EB"/>
    <text x="860" y="7" font-family="PingFang SC" font-size="12" font-weight="600" fill="white" text-anchor="middle">保存</text>
  </g>

  <rect x="30" y="210" width="940" height="70" rx="10" fill="white" stroke="#E2E8F0"/>
  <text x="50" y="250" font-family="PingFang SC" font-size="14" font-weight="600" fill="#1E293B">告警通知</text>
  <rect x="130" y="232" width="120" height="26" rx="13" fill="#F0FDF4" stroke="#BBF7D0"/>
  <circle cx="145" cy="245" r="3" fill="#16A34A"/>
  <text x="155" y="250" font-family="PingFang SC" font-size="12" fill="#166534">SMTP 已就绪</text>
  <text x="280" y="250" font-family="Arial" font-size="12" fill="#94A3B8">lishi0105@163.com</text>
  
  <rect x="850" y="231" width="100" height="28" rx="6" stroke="#2563EB" fill="white"/>
  <text x="900" y="250" font-family="PingFang SC" font-size="12" font-weight="600" fill="#2563EB" text-anchor="middle">配置邮件</text>

  <rect x="30" y="300" width="940" height="150" rx="10" fill="white" stroke="#E2E8F0"/>
  <text x="50" y="330" font-family="PingFang SC" font-size="14" font-weight="600" fill="#1E293B">数据库维护 (SQLite)</text>
  
  <g transform="translate(50, 360)">
    <rect width="880" height="36" rx="6" fill="#F8FAFC"/>
    <text x="12" y="23" font-family="PingFang SC" font-size="13" fill="#334155">空间碎片整理 (VACUUM)：释放物理磁盘空间</text>
    <rect x="810" y="6" width="60" height="24" rx="4" fill="#334155"/>
    <text x="840" y="22" font-family="PingFang SC" font-size="11" fill="white" text-anchor="middle">执行</text>
  </g>

  <g transform="translate(50, 405)">
    <rect width="880" height="36" rx="6" fill="#FFFBEB"/>
    <text x="12" y="23" font-family="PingFang SC" font-size="13" fill="#92400E">自动清理策略：保留近</text>
    <rect x="145" y="6" width="40" height="24" rx="4" fill="white" stroke="#D97706"/>
    <text x="165" y="23" font-family="Arial" font-size="13" fill="#1E293B" text-anchor="middle">30</text>
    <text x="195" y="23" font-family="PingFang SC" font-size="13" fill="#92400E">天历史记录</text>
    
    <rect x="810" y="6" width="60" height="24" rx="4" fill="#D97706"/>
    <text x="840" y="22" font-family="PingFang SC" font-size="11" fill="white" text-anchor="middle">清理</text>
  </g>
</svg>
