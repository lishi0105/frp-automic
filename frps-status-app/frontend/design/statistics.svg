<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#EFF6FF"/>
      <stop offset="1" stop-color="#F0FDFA"/>
    </linearGradient>
    <linearGradient id="areaBlue" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#2563EB" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="areaGreen" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#059669" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#059669" stop-opacity="0"/>
    </linearGradient>
    <style>
      .cn { font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, Menlo, monospace; }
      .h1 { font-size: 24px; font-weight: 700; fill: #0F172A; }
      .h2 { font-size: 15px; font-weight: 700; fill: #0F172A; }
      .label { font-size: 12px; fill: #64748B; }
      .muted { font-size: 12px; fill: #94A3B8; }
      .value { font-size: 28px; font-weight: 750; fill: #0F172A; }
      .card { fill: #FFFFFF; stroke: #E2E8F0; filter: url(#shadow); }
      .line { stroke: #E2E8F0; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="#F6F8FB"/>

