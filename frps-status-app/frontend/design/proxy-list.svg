      .mono { font-family: "SFMono-Regular", Consolas, Menlo, monospace; }
      .h1 { font-size: 24px; font-weight: 700; fill: #0F172A; }
      .h2 { font-size: 15px; font-weight: 700; fill: #0F172A; }
      .label { font-size: 12px; fill: #64748B; }
      .muted { font-size: 12px; fill: #94A3B8; }
      .value { font-size: 28px; font-weight: 750; fill: #0F172A; }
      .card { fill: #FFFFFF; stroke: #E2E8F0; filter: url(#shadow); }
      .line { stroke: #E2E8F0; stroke-width: 1; }
